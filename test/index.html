<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>led-painter-card test</title>
<!--
  Development harness: the card with a fake Home Assistant.
  Serve the repository root with any static web server and open /test/.
  Hash flags (combine freely):  #pl      Polish
                                #dialog  the paint dialog instead of a card
                                #group   a two-light group
                                #paint   start in the Paint effect
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  html{--primary-color:#03a9f4;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;
    --divider-color:rgba(225,225,225,.12);--card-background-color:#1c1c1c}
  body{margin:0;padding:24px;background:#111;font-family:Roboto,"Segoe UI",Arial,sans-serif}
  ha-card{display:block;background:var(--card-background-color);border-radius:12px;color:var(--primary-text-color);border:1px solid var(--divider-color)}
  #host{max-width:440px}
  pre{color:#9b9b9b;font-size:11px;white-space:pre-wrap;word-break:break-all}
</style>
<home-assistant></home-assistant>
<div id="host"></div>
<pre id="log"></pre>
<script>
  const MDI = 'https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css';
  customElements.define('ha-card', class extends HTMLElement {});
  customElements.define('home-assistant', class extends HTMLElement {});
  customElements.define('ha-icon', class extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const name = (this.getAttribute('icon') || '').replace('mdi:', '');
      this.style.display = 'inline-flex';
      this.attachShadow({ mode: 'open' }).innerHTML = '<link rel="stylesheet" href="' + MDI + '">'
        + '<i class="mdi mdi-' + name + '" style="font-size:var(--mdc-icon-size,24px);line-height:1;display:block"></i>';
    }
  });
</script>
<script type="module">
  const flags = location.hash;
  const calls = window.calls = [];
  const startFx = flags.includes('paint') ? 'Paint' : 'Rainbow';
  const fxList = ['None', 'Paint', 'Rainbow', 'Rainbow fast', 'Color wipe', 'Scan', 'Twinkle', 'Fireworks', 'Flicker', 'Breathe', 'Wave'];
  const light = (name) => ({ state: 'on', attributes: { friendly_name: name, brightness: 255, rgb_color: [255, 120, 0], effect: startFx, effect_list: fxList } });
  const states = {
    'light.desk_strip': light('Desk strip'),
    'light.shelf_strip': light('Shelf strip'),
    'sensor.desk_painter_zones': { state: '28', attributes: {} },
    'sensor.shelf_painter_zones': { state: '60', attributes: {} },
    'light.all_strips': { state: 'on', attributes: { friendly_name: 'All strips', brightness: 255, effect: startFx,
      effect_list: fxList, entity_id: ['light.desk_strip', 'light.shelf_strip'] } },
  };
  const entity = flags.includes('group') ? 'light.all_strips' : 'light.desk_strip';
  const members = entity === 'light.all_strips' ? states[entity].attributes.entity_id : [entity];
  const ha = document.querySelector('home-assistant');
  let card = null;
  const refresh = () => { ha.hass = Object.assign({}, hass); if (card) card.hass = ha.hass; };
  const hass = {
    language: flags.includes('pl') ? 'pl' : 'en',
    states,
    entities: {
      'light.desk_strip': { device_id: 'd1', area_id: 'office' }, 'sensor.desk_painter_zones': { device_id: 'd1' },
      'light.shelf_strip': { device_id: 'd2', area_id: 'office' }, 'sensor.shelf_painter_zones': { device_id: 'd2' },
    },
    devices: { d1: { name: 'Desk' }, d2: { name: 'Shelf' } },
    areas: { office: { name: 'Office' } },
    services: { esphome: { desk_paint: {}, shelf_paint: {} } },
    connection: { sendMessagePromise: async () => ({}) },
    callWS: async () => ({ value: null }),
    callService: async (domain, service, data) => {
      calls.push([domain, service, data]);
      document.getElementById('log').textContent = calls.slice(-4).map((c) => c[0] + '.' + c[1] + ' ' + JSON.stringify(c[2]).slice(0, 150)).join('\n');
      if (domain === 'light') {
        const ids = [data.entity_id].concat(data.entity_id === entity ? members : []);
        ids.forEach((id) => {
          const st = states[id]; if (!st) return;
          st.state = service === 'turn_off' ? 'off' : 'on';
          if (data.effect) st.attributes.effect = data.effect;
          if (data.rgb_color) st.attributes.rgb_color = data.rgb_color;
          if (data.brightness_pct) st.attributes.brightness = data.brightness_pct * 2.55;
        });
        if (entity === 'light.all_strips' && data.effect) states[entity].attributes.effect = data.effect;
      }
      refresh();
    },
  };
  ha.hass = hass;
  await import('../dist/led-painter-card.js');

  if (flags.includes('dialog')) {
    const dlg = document.createElement('led-painter-dialog');
    dlg.entity = entity;
    document.body.appendChild(dlg);
    window.card = dlg.shadowRoot.querySelector('led-painter-card');
  } else {
    card = document.createElement('led-painter-card');
    card.setConfig({ entity });
    document.getElementById('host').appendChild(card);
    card.hass = hass;
    window.card = card;
  }
</script>
